<div class="container p-4">
  <div class="d-flex align-items-center justify-content-center mt-5">
    <span class="titulo-editar mt-4">Editar Expediente</span>
  </div>

  <form action="">
    <div class="mt-3">
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Número del expediente</mat-label>
      <input type="text" matInput  style="color: #65677A;"/>
      </mat-form-field>
    </div>

    <div class="mt-1">
      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Unidad administrativa</mat-label>
        <input type="text" matInput  style="color: #65677A;"/>
        </mat-form-field>
      </div>

      <span class="ajustes-opcionales ms-3">Ajustes opcionales</span>

      <div class="d-flex ms-3 mt-3  align-items-center">
        <span class="estado">Estado</span>
        <div class="form-check form-switch ms-5">
          <mat-slide-toggle class="toogle"  formControlName="estado"></mat-slide-toggle>
        </div>
      </div>

      <div class=" ms-3 mt-4 contenedor-usuarios mb-5">
        <span class="ajustes-opcionales ms-2 " >Usuarios con acceso</span>
        <div class="d-flex justify-content-between align-items-center mb-5 ">
          <button type="button" class="align-items-center d-flex btn-exportar ms-2 mt-2">
            <mat-icon style="color: #6D788D;">ios_share_outlined</mat-icon>
            <span class="exportar">EXPORTAR</span>
          </button>
          <div class="d-flex">
            <input type="text" class=" buscar-usuario" placeholder="Buscar usuario">
            <button type="button" class="btn-añadir-usuario">
              AÑADIR USUARIO
            </button>
          </div>

        </div>
      </div>
  </form>
</div>
