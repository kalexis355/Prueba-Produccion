<div *ngIf="tipoVista==='cuadricula'">
  <div class="row g-4">
    <div class="col-md-2" *ngFor="let carpeta of carpetasFiltradas; let i = index" style="width: 25%; cursor: pointer;">
      <div class="card" (contextmenu)="onContextMenu($event, carpeta.Cod)"
      [routerLink]="['/dashboard/carpeta',carpeta.Cod]"
      [state]="{ carpetaHija: carpeta }"
      (click)="onCarpetaClick(carpeta)">
      <div class="card-header d-flex justify-content-between align-items-center p-3 " >

        <div class="carpeta-icono d-flex align-items-center justify-content-center">
          <mat-icon style="color: #02BCD4;">folder_open</mat-icon>
        </div>
        <div class="cuarenta-archivos-contenedor d-flex align-items-center justify-content-center">
          <span class="cuarenta-archivos">40 archivos</span>
        </div>

          <div class="avatar-group">
            <div class="avatar">
              OP
            </div>
            <div class="avatar">
              OP
            </div>
            <div class="avatar">
              OP
            </div>
            <div class="avatar more">
              +3
            </div>
          </div>

      </div>
      <div class="card-body d-flex flex-column" style="background-color: #00BCD4;">
        <span class="carpeta-nombre">{{carpeta.Nombre}}</span>
        <span class="modificacion mt-1">última modificación hace 2 dias</span>
        <span class="modificacion mt-1">Fecha de creación {{carpeta.FechaCreacion | date}}</span>
        <mat-divider class="division mt-2"></mat-divider>

        <div>

        </div>
      </div>

      </div>
    </div>
  </div>
</div>
<div *ngIf="tipoVista === 'lista'">
  diseño lista
</div>
